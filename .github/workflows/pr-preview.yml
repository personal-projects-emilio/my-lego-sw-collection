name: PR Preview

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - closed

concurrency: preview-${{ github.ref }}

jobs:
  preview:
    name: Deploy preview
    runs-on: ubuntu-latest
    env:
      VITE_BASE_URL: ${{ vars.VITE_BASE_URL }}/pr-preview/pr-${{ github.event.pull_request.number}}
      VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
      VITE_APP_AUTH_BASE_URL: ${{ vars.VITE_APP_AUTH_BASE_URL }}
      VITE_APP_REFRESH_AUTH_BASE_URL: ${{ vars.VITE_APP_REFRESH_AUTH_BASE_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        if: github.event.action != 'closed'
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node
        if: github.event.action != 'closed'
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'

      - name: Install and Build
        if: github.event.action != 'closed'
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      # Deploys on open/sync and removes the preview on close.
      # The root 404.html comes from the production deploy and already redirects /pr-preview/pr-N paths.
      - name: Deploy preview
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: ./dist
          umbrella-dir: pr-preview
