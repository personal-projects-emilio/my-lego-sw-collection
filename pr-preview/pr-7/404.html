<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Redirecting...</title>
    <script>
      // GitHub Pages SPA redirect hack
      // This script takes the current pathname and encodes it as a query parameter
      // to pass to index.html, which will then restore the correct route
      ;(function () {
        var baseUrl = '/my-lego-sw-collection/pr-preview/pr-7'
        var pathName = window.location.pathname

        // Remove the base URL from the pathname to get the app route
        if (pathName.indexOf(baseUrl) === 0) {
          pathName = pathName.substring(baseUrl.length)
        }

        // If we're at the root or index.html, redirect to the base
        if (pathName === '/' || pathName === '/index.html' || pathName === '') {
          window.location.replace(baseUrl + '/')
          return
        }

        // Otherwise, redirect to index.html with the path as a query parameter
        var redirect =
          baseUrl +
          '/?redirect=' +
          encodeURIComponent(
            pathName + window.location.search + window.location.hash
          )
        window.location.replace(redirect)
      })()
    </script>
  </head>
  <body>
    <p>Redirecting...</p>
  </body>
</html>
