<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Lego SW Collection</title>
    <script>
      ;(function () {
        var redirect = new URLSearchParams(window.location.search).get(
          'redirect'
        )
        if (redirect) {
          var newUrl = window.location.pathname + redirect
          window.history.replaceState(null, '', newUrl)
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
